name: Verificar recuperación

on:
  push:
    branches: [recuperacion-fuentes-1.3.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependencias de comprobación
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-calc
          python -m pip install -r recovered-source/requirements.txt
      - name: Comprobar recuperación y cálculos
        run: bash recovered-source/scripts/verify_environment.sh
      - name: Comprobar que el respaldo incluye la revisión actual
        run: |
          python recovered-source/scripts/create_backup.py --output /tmp/Hogar_Playa_Recuperacion_Fuentes.zip
          cmp Hogar_Playa_Recuperacion_Fuentes.zip /tmp/Hogar_Playa_Recuperacion_Fuentes.zip
